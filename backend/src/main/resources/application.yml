spring:
  application:
    name: warehouse-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/warehouse}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

logging:
  level:
    org.hibernate.SQL: debug


warehouse:
  demo-admin:
    password: ${DEMO_ADMIN_PASSWORD:admin1234}
  demo-scenario:
    enabled: ${DEMO_SCENARIO_ENABLED:false}
    mate-password: ${DEMO_MATE_PASSWORD:mate1234}
  session:
    heartbeat-uncertain-minutes: ${HEARTBEAT_UNCERTAIN_MINUTES:3}
    network-timeout-minutes: ${NETWORK_TIMEOUT_MINUTES:10}
